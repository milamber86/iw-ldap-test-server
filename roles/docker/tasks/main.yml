---
- name: Check whether Docker engine is already running
  ansible.builtin.command: docker info
  register: docker_info
  changed_when: false
  failed_when: false

- name: Record Docker already present
  ansible.builtin.set_fact:
    docker_already_running: "{{ docker_info.rc == 0 }}"

- name: Fail when Docker is missing on a non-EL9 host
  ansible.builtin.fail:
    msg: >-
      Docker CE install from this role supports EL9 only.
      Install Docker on this host yourself and re-run with SKIP_DOCKER=1.
  when:
    - not docker_already_running
    - not (ansible_os_family == 'RedHat' and ansible_distribution_major_version | string == '9')

- name: Install Docker CE on EL9
  when:
    - ansible_os_family == 'RedHat'
    - ansible_distribution_major_version | string == '9'
  block:
    - name: Add Docker CE repository
      ansible.builtin.get_url:
        url: "{{ docker_ce_repo_url }}"
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"
      when: not docker_already_running

    - name: Install Docker packages
      ansible.builtin.dnf:
        name: "{{ docker_packages }}"
        state: present
      when: not docker_already_running

    - name: Install python3-pip
      ansible.builtin.dnf:
        name: python3-pip
        state: present

    - name: Install Python Docker SDK for community.docker
      ansible.builtin.pip:
        name: docker
        extra_args: --upgrade

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
